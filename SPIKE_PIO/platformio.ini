; Standalone Phase 0 spike — not the production toilet_kat_change app.
; Build: cd SPIKE_PIO && pio run
; Flash: use ../scripts/spike-pio-overwrite.ps1 (do not pio run -t upload)
;
; pioarduino platform + Arduino 3.3.2 for esp_private/cache_utils.h (IDF 5.4+).
; First build installs toolchains; script pins click<8.2 for esptool 5.x on Windows.

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.2/esp32-3.3.2.zip
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.sdkconfig = sdkconfig.defaults
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
